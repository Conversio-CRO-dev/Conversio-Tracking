name = "conversio-tag-loader"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Serves the static bundles in ./public (e.g. runtime-tag.2.2.js) under the
# ASSETS binding used by src/index.js. Requests that don't match a key are
# handled entirely by the Worker, so run_worker_first stays on.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Create with: wrangler kv namespace create CLIENT_KEYS
# Then paste the returned id below.
[[kv_namespaces]]
binding = "CLIENT_KEYS"
id = "f5e336ebb4a54c6484b00c08de29ef86"

# Custom Domains map the whole hostname to this Worker (no path wildcards
# allowed here) - path routing for /t/<key>.js happens inside src/index.js.
[[routes]]
pattern = "tag.conversio.dev"
custom_domain = true

# Caps requests per client key to a circuit-breaker level, not a normal-traffic
# level - this exists so a scraped/abused key can't run up request costs or
# degrade service for every other client sharing this Worker. period must be
# 10 or 60 (a Workers platform constraint). Tune `limit` to comfortably clear
# your busiest real client's peak traffic; 3000/60s (~50 req/s sustained) is
# a starting point, not a measured value.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3000
  period = 60

# Enables Cloudflare Workers Logs (dashboard-visible, queryable, and required
# for `wrangler tail` to show anything beyond the current terminal session).
[observability]
enabled = true
