name = "conversio-tag-loader"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Serves the static bundles in ./public (e.g. runtime-tag.2.2.js) under the
# ASSETS binding used by src/index.js. Requests that don't match a key are
# handled entirely by the Worker, so run_worker_first stays on.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Create with: wrangler kv namespace create CLIENT_KEYS
# Then paste the returned id below.
[[kv_namespaces]]
binding = "CLIENT_KEYS"
id = "f5e336ebb4a54c6484b00c08de29ef86"

# Custom Domains map the whole hostname to this Worker (no path wildcards
# allowed here) - path routing for /t/<key>.js happens inside src/index.js.
[[routes]]
pattern = "tag.conversio.dev"
custom_domain = true

# Caps requests per client key to a circuit-breaker level, not a normal-traffic
# level - this exists so a scraped/abused key can't run up request costs or
# degrade service for every other client sharing this Worker. period must be
# 10 or 60 (a Workers platform constraint).
#
# The limit is enforced per key *per Cloudflare location*, not globally, so
# 30000/60s is 500 req/s per key in each colo independently. That is sized off
# a 12M-users/month client on a campaign day: their busiest colo models to
# 51-68 req/s depending on how geographically concentrated their traffic is,
# so this sits roughly 7x clear of the worst case. The previous 3000 (50 req/s)
# sat *below* that worst case, which would have served 429s to a real client at
# their peak.
#
# Still a starting point rather than a measured value. Replace with ~10x the
# real per-key peak req/s per colo once that is instrumented (via Analytics
# Engine or the GraphQL analytics API, not per-request logging - see the
# readiness assessment). Once it is sized off measurement, any 429 at all means
# abuse or a runaway, never normal traffic, so alert on the first one.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30000
  period = 60

# Enables Cloudflare Workers Logs (dashboard-visible, queryable, and required
# for `wrangler tail` to show anything beyond the current terminal session).
# The top-level `enabled` is the master switch and is required: Cloudflare's
# docs are explicit that nested properties alone do not turn logging on, so
# `[observability.logs]` without this reads as valid to wrangler (no warning at
# deploy) while leaving Workers Logs off. Since the loader logs only exception
# paths, "off" and "nothing went wrong" look identical, which is the wrong thing
# to be uncertain about when this is the only monitoring there is.
[observability]
enabled = true

# invocation_logs is true by default, so this states the default rather than
# changing it. It is here to be found: at portfolio volume it is the setting to
# turn off, one event per invocation being what would run past the 20M events
# per month the paid plan includes, whereas the reason-coded logs above are
# rare by design.
[observability.logs]
invocation_logs = true

[observability.traces]
enabled = false

